<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#080E1D"/>
    </linearGradient>
    <linearGradient id="cardBlue" x1="12" y1="8" x2="50" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="foilGold" x1="14" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>

  <!-- Obsidian Base -->
  <rect width="64" height="64" rx="12" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="10.5" stroke="#2563EB" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- Dimensional Collector Card Frame -->
  <rect x="13" y="10" width="36" height="46" rx="4" fill="url(#cardBlue)" stroke="url(#foilGold)" stroke-width="2.2"/>
  <rect x="17" y="14" width="28" height="38" rx="2" fill="#0F172A" fill-opacity="0.72" stroke="#F59E0B" stroke-opacity="0.45" stroke-width="1"/>

  <!-- ECQ Monogram -->
  <text x="31" y="38.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="14.5" letter-spacing="0.5" fill="url(#foilGold)">ECQ</text>

  <!-- Top-Right Foil Gold Star Crest -->
  <path d="M49 6L51.3 12.7L58 15L51.3 17.3L49 24L46.7 17.3L40 15L46.7 12.7L49 6Z" fill="url(#foilGold)" stroke="#0F172A" stroke-width="1.2" stroke-linejoin="round"/>
</svg>
